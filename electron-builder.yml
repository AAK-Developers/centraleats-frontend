appId: com.centraleats.desktop
productName: CentralEats
copyright: Copyright © 2026 CentralEats - AAK Developers

directories:
  output: release
  buildResources: resources

files:
  - dist-electron/**/*
  - resources/**/*
  - "!node_modules"
  - "!src"
  - "!electron"
  - "!public"
  - "!dist"
  - "!**/*.ts"
  - "!**/*.map"
  - "!.env*"

# Windows
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CentralEats

# macOS
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-category.business
  artifactName: "${productName}-${version}-${arch}.${ext}"

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Linux
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: resources/icons
  category: Office
  artifactName: "${productName}-${version}-${arch}.${ext}"

# Extra metadata
extraMetadata:
  main: dist-electron/main.js
